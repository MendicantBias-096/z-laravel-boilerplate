name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 trae los tags. Sin ellos `git describe` falla aunque el
      # tag exista y sea ancestro de HEAD, así que el check de versión (R36)
      # daría rojo por la configuración del runner, no por el repositorio.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Arch rules (arch-lint.sh)
        run: ./scripts/arch-lint.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pgsql, pdo_pgsql, zip, gd, bcmath

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Un aviso de seguridad en una dependencia no aparece solo: hay que
      # preguntar. Bloquea porque hoy sale limpio, y el día que deje de
      # estarlo es justo cuando hay que enterarse.
      - name: Composer audit
        run: composer audit

      - name: Pint (format check)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis, with PHPat)
        run: vendor/bin/phpstan analyse --no-progress

      # arch:check necesita que Laravel arranque, no la base de datos: solo
      # lee código. Va en Lint y no en Tests para que una regla de
      # arquitectura no ponga en rojo un check que se llama «Tests».
      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate

      - name: Arch check (needs the code)
        run: php artisan arch:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: laravel_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # fetch-depth: 0 trae los tags. Sin ellos `git describe` falla aunque el
      # tag exista y sea ancestro de HEAD, así que el check de versión (R36)
      # daría rojo por la configuración del runner, no por el repositorio.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pgsql, pdo_pgsql, zip, gd, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: laravel_testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
        run: php artisan test --compact

  # Que los assets compilen es una afirmación distinta de que los tests pasen,
  # así que falla con su propio nombre en la lista de checks del PR (R56).
  assets:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Informativo y no bloqueante: los avisos vivos están todos en
      # dependencias de build (vite, tailwind, blade-formatter) que no llegan
      # al navegador. Ponerlo en rojo de forma permanente es como se enseña a
      # ignorar un check.
      - name: Bun audit
        run: bun audit
        continue-on-error: true

      - name: Build
        run: bun run build
