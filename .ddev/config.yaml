name: laravel-boilerplate
type: laravel
docroot: public
php_version: "8.5"
webserver_type: nginx-fpm

database:
  type: postgres
  version: "16"

# Variables inyectadas dentro del contenedor DDEV — sobreescriben el .env
# El .env queda como config de Herd; DDEV no lo toca.
web_environment:
  - APP_URL=https://laravel-boilerplate.ddev.site
  - DB_CONNECTION=pgsql
  - DB_HOST=db
  - DB_PORT=5432
  - DB_DATABASE=laravel_boilerplate_db
  - DB_USERNAME=laravel_boilerplate_user
  - DB_PASSWORD=laravel_boilerplate
  # Solo para `backup:run`. El cliente de Postgres de esta imagen ignora
  # PGPASSFILE —comprobado: con permisos 644 no emite ni el aviso de fichero
  # inseguro—, que es como spatie/db-dumper pasa la clave, asi que sin esto
  # `pg_dump` pide contrasena y el backup de la base falla solo aqui.
  - PGPASSWORD=laravel_boilerplate
  - VITE_DEV_SERVER_URL=${VITE_DEV_SERVER_URL:-https://laravel-boilerplate.ddev.site:5173}
  - MAIL_HOST=localhost
  - MAIL_PORT=1025
  - REVERB_HOST=laravel-boilerplate.ddev.site
  - REVERB_PORT=8085
  - REVERB_SCHEME=https
  - VITE_REVERB_APP_KEY=${REVERB_APP_KEY:-cnpnnue13li281eckr88}
  - VITE_REVERB_HOST=laravel-boilerplate.ddev.site
  - VITE_REVERB_PORT=8085
  - VITE_REVERB_SCHEME=https

# ── Puertos extra (Vite HMR, Reverb) ──────────────────────────────────────────
# Definidos en config.local.yaml para permitir override por máquina.
# Ver config.local.yaml.example como referencia.

use_dns_when_possible: true
composer_version: "2"

# Bun se instala en .ddev/web-build/Dockerfile.
#
# Sin `hooks:` a proposito. Habia un `post-stop` que reescribia el .env con
# valores de Herd de otra maquina —incluido DB_USERNAME=am-mac— en cada
# `ddev stop`, asi que parar el entorno rompia la conexion a la base de datos.

