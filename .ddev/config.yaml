name: laravel12-boilerplate
type: laravel
docroot: public
php_version: "8.5"
webserver_type: nginx-fpm

database:
  type: postgres
  version: "16"

# Variables inyectadas dentro del contenedor DDEV — sobreescriben el .env
# El .env queda como config de Herd; DDEV no lo toca.
web_environment:
  - APP_URL=https://laravel12-boilerplate.ddev.site
  - DB_HOST=db
  - DB_PORT=5432
  - DB_DATABASE=db
  - DB_USERNAME=db
  - DB_PASSWORD=db
  - VITE_DEV_SERVER_URL=https://laravel12-boilerplate.ddev.site:5173
  - MAIL_HOST=localhost
  - MAIL_PORT=1025
  - REVERB_HOST=laravel12-boilerplate.ddev.site
  - REVERB_PORT=8085
  - REVERB_SCHEME=https
  - VITE_REVERB_APP_KEY=${REVERB_APP_KEY:-cnpnnue13li281eckr88}
  - VITE_REVERB_HOST=laravel12-boilerplate.ddev.site
  - VITE_REVERB_PORT=8085
  - VITE_REVERB_SCHEME=https

# ── Vite HMR port ──────────────────────────────────────────────────────────
web_extra_exposed_ports:
  - name: vite
    container_port: 5173
    http_port: 5172
    https_port: 5173
  - name: reverb
    container_port: 8080
    http_port: 8084
    https_port: 8085

use_dns_when_possible: true
composer_version: "2"

# ── Hooks ──────────────────────────────────────────────────────────────────
# Bun is installed via .ddev/web-build/Dockerfile

hooks:
  post-stop:
    # Al parar DDEV, actualiza solo las keys de entorno en .env para Herd.
    # No sobreescribe el .env completo para preservar secretos (API keys, etc.)
    - exec-host: |
        if [ -f .env ]; then
          sed -i '' 's|^APP_URL=.*|APP_URL=https://z-laravel-boilerplate.test|' .env
          sed -i '' 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i '' 's|^DB_DATABASE=.*|DB_DATABASE=z_laravel_boilerplate|' .env
          sed -i '' 's|^DB_USERNAME=.*|DB_USERNAME=am-mac|' .env
          sed -i '' 's|^DB_PASSWORD=.*|DB_PASSWORD=|' .env
          sed -i '' 's|^MAIL_HOST=.*|MAIL_HOST=127.0.0.1|' .env
          sed -i '' 's|^MAIL_PORT=.*|MAIL_PORT=1025|' .env
          echo '.env actualizado para Herd'
        fi
